name: Sync with Upstream

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout custom branch
        uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/decolua/9router.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Rebase custom onto upstream/master
        run: git rebase upstream/master

      - name: Force push rebased custom branch
        run: git push --force-with-lease origin custom
